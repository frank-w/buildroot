# This is a basic workflow to help you get started with Actions

name: CI

# Controls when the action will run. 
on:
  # Triggers the workflow on push or pull request events but only for the master branch
  push:
    branches:
    - master
    - 'ci-*'
    - '*-bpi'
  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# A workflow run is made up of one or more jobs that can run sequentially or in parallel
jobs:
  # This workflow contains a single job called "build"
  build_arm:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2
        with:
          fetch-depth: 10

      - name: Setup env
        run: |
          echo "DT=$(date +'%Y-%m-%d_%H%M')" >> $GITHUB_ENV
          echo "VER=$(git describe)_arm" >> $GITHUB_ENV
          echo "BRANCH=${GITHUB_REF##*/}" >> $GITHUB_ENV
      - name: Print env
        run: |
          echo $BRANCH $VER $DT

      - name: build for bpi-r2
        run: |
          ./build.sh importconfig
          ./build.sh build

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          #repo_name: frank-w/buildroot
          # A personal access token for the GitHub repository in which the release will be created and edited.
          # It is recommended to create the access token with the following scopes: `repo, user, admin:repo_hook`.
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: rootfs*.cpio.*
          tag:  "CI-BUILD-${{ env.BRANCH }}-${{ env.VER }}-${{ env.DT }}"
          overwrite: true
          body: "release for bpi-r2"
          file_glob: true

  build_arm64:
    # The type of runner that the job will run on
    runs-on: ubuntu-latest

    # Steps represent a sequence of tasks that will be executed as part of the job
    steps:
      # Checks-out your repository under $GITHUB_WORKSPACE, so your job can access it
      - uses: actions/checkout@v2
        with:
          fetch-depth: 10

      - name: Setup env
        run: |
          echo "DT=$(date +'%Y-%m-%d_%H%M')" >> $GITHUB_ENV
          echo "VER=$(git describe)_arm64" >> $GITHUB_ENV
          echo "BRANCH=${GITHUB_REF##*/}" >> $GITHUB_ENV
      - name: Print env
        run: |
          echo $BRANCH $VER $DT

      - name: build for bpi-r3
        run: |
          ./build.sh clean
          echo 'board=bpi-r3' > build.conf #change board to r3
          ./build.sh importconfig
          ./build.sh build

      - name: Upload binaries to release
        uses: svenstaro/upload-release-action@v2
        with:
          #repo_name: frank-w/buildroot
          # A personal access token for the GitHub repository in which the release will be created and edited.
          # It is recommended to create the access token with the following scopes: `repo, user, admin:repo_hook`.
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          file: rootfs*.cpio.*
          tag:  "CI-BUILD-${{ env.BRANCH }}-${{ env.VER }}-${{ env.DT }}"
          overwrite: true
          body: "release for bpi-r64 + r2pro + r3"
          file_glob: true
